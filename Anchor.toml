[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sumofrog = "6h1PqXArg2Ap1CJdR1hXXWhqSrzkeboqi5cx1y44NvTW"

[programs.devnet]
sumofrog = "6h1PqXArg2Ap1CJdR1hXXWhqSrzkeboqi5cx1y44NvTW"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
# A throwaway local test key, never the deployer/upgrade key (Ribbit, 2 Nov 2026). Anchor commands
# that sign (deploy, upgrade, test without --provider.wallet) fail if it doesn't exist, which is the
# point. Make one with: solana-keygen new --no-bip39-passphrase -o .keys/test-wallet.json
# Deploys pass the upgrade key explicitly (scripts/deploy-devnet.sh uses --keypair .keys/deployer.json).
wallet = ".keys/test-wallet.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test]
startup_wait = 40000

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"
