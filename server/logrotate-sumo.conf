# Sumo Frog private test validator log (worthless test network). Run hourly by sumo-logrotate.timer.
# daily + maxsize: rotates once a day, or sooner if the live log passes 200M at an hourly check.
# copytruncate: the validator keeps writing (O_APPEND) to the same file, so no restart is needed.
/home/ubuntu/sumo/ledger/validator-*.log {
    su ubuntu ubuntu
    daily
    maxsize 200M
    rotate 2
    compress
    missingok
    notifempty
    copytruncate
}
