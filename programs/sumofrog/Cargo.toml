[package]
name = "sumofrog"
version = "0.1.0"
description = "Sumo Frog ($SUMO): a toy, devnet-only, proof-of-work mineable token"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sumofrog"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.2", features = ["token", "associated_token", "metadata"] }
solana-sha256-hasher = "2.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
