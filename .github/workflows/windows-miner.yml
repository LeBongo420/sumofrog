name: Build Windows miner

# Manual only. Do not run this on push. Do not release from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r miner/requirements-windows-build.txt

      - name: Build windowed app
        run: python -m PyInstaller miner/sumo_gui.spec --noconfirm --clean --distpath dist

      - name: SHA-256 and safety checks
        shell: pwsh
        run: |
          $exe = "dist/SumoFrog/SumoFrog.exe"
          if (-not (Test-Path $exe)) { throw "SumoFrog.exe was not built" }
          $bad = Get-ChildItem -Recurse dist -File | Where-Object {
            $_.Name -match 'sumo-devnet-key|keypair|\.env$' -or $_.Name -eq 'sumo_config.json'
          }
          if ($bad) { throw "Refusing to upload: wallet, key, .env or private config found in dist" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $line = "SumoFrog.exe SHA-256 $hash"
          $line | Out-File -FilePath dist/SumoFrog/SHA256.txt -Encoding ascii
          Write-Host $line

      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sumo-frog-windows-miner
          path: dist/SumoFrog/**
          if-no-files-found: error
